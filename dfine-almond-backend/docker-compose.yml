version: '3.8'

services:
  dfine-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dfine-almond-backend

    ports:
      - "9091:9091"

    volumes:
      # Mount model weights (must exist on host)
      - ./models:/app/models:ro
      # Optional: Mount logs directory
      - ./logs:/app/logs

    environment:
      # Model Configuration
      - MODEL_PATH=/app/models/model_2.pt
      - INPUT_SIZE=1280x448
      - NUM_CLASSES=35

      # Label Studio Configuration
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}

      # AWS S3 Configuration (for image access)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}

      # Python Configuration
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - label-studio-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  label-studio-network:
    external: true
    # If using with existing Label Studio, connect to same network:
    # docker network create label-studio-network
